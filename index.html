<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visibility Unleashed Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F2FC; --bg2:#FCEFF7; --surface:#FFFFFF; --ink:#26143A; --muted:#6F6084; --line:#E4D9F1;
  --purple:#6B2FC7; --purple-soft:#EFE6FB; --pink:#D63384; --pink-soft:#FCE6F1; --pink-text:#B4206F;
  --gt1:#6B2FC7; --gt2:#D63384; --gt:linear-gradient(90deg,var(--gt1),var(--gt2));
  --grad:linear-gradient(135deg,#7A3BE0 0%,#B93CC4 52%,#D63384 100%);
  --display:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --ui:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#150B24; --bg2:#1E0F2C; --surface:#20132F; --ink:#F5EEFC; --muted:#B9A7D0; --line:#3B2857;
    --purple:#B892FF; --purple-soft:#2E1B4A; --pink:#FF6BB3; --pink-soft:#421A36; --pink-text:#FF8CC6; --gt1:#B892FF; --gt2:#FF6BB3;
  }
}
:root[data-theme="dark"]{
  --bg:#150B24; --bg2:#1E0F2C; --surface:#20132F; --ink:#F5EEFC; --muted:#B9A7D0; --line:#3B2857;
  --purple:#B892FF; --purple-soft:#2E1B4A; --pink:#FF6BB3; --pink-soft:#421A36; --pink-text:#FF8CC6; --gt1:#B892FF; --gt2:#FF6BB3;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:28px 20px 80px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px}

h1{font-family:var(--display);font-weight:600;font-size:clamp(2.2rem,7vw,3.4rem);line-height:1;margin:0}
.sub{color:var(--muted);margin-top:8px;max-width:52ch}
.sync{font-size:.8rem;color:var(--muted);margin-top:8px}

.days{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;margin:26px 0 8px}
.dot{aspect-ratio:1;border-radius:50%;border:1.5px solid var(--line);background:transparent;font-size:.78rem;color:var(--muted);display:grid;place-items:center;padding:0;transition:background .2s,border-color .2s}
.dot.planned{border-color:var(--pink);color:var(--ink);background:var(--pink-soft)}
.dot.done{background:var(--pink);border-color:var(--pink);color:var(--surface);font-weight:600}
.dot.today{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--purple)}
.dot.sel{border-width:3px;border-color:var(--ink)}
.legend{font-size:.8rem;color:var(--muted)}

.progress{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0 30px}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:12px;flex:1 1 220px}
.pill .n{font-family:var(--display);font-size:2rem;font-weight:600;line-height:1}
.pill .l{font-size:.85rem;color:var(--muted);line-height:1.3}
.pill.convo{border-color:var(--purple);background:var(--purple-soft)}
.pill .ctr{display:flex;align-items:center;gap:10px}
.pill .ctr button{width:30px;height:30px;border-radius:50%;border:1px solid var(--purple);background:var(--surface);line-height:1}

.dayhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:20px}
.dayhead h2{font-family:var(--display);font-size:2.2rem;font-weight:600;margin:0;line-height:1}
.dayhead .date{color:var(--muted);font-size:.95rem;margin-top:4px}
.nav{display:flex;gap:6px}
.nav button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.2rem}
.nav button:disabled{opacity:.35;cursor:default}

label.f,.f{display:block;font-weight:600;font-size:.9rem;margin:0 0 6px}
.hint{font-weight:400;color:var(--muted);font-size:.82rem}
input[type=text],input[type=url],textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
textarea{resize:vertical;line-height:1.55}
.block{margin-bottom:22px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 13px;font-size:.9rem}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.ch{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:16px}
.ch-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.ch-head h3{margin:0;font-size:1.1rem;font-weight:600}
.field{margin-bottom:14px}
.field-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.copy{border:none;background:none;color:var(--purple);font-size:.85rem;font-weight:600;padding:2px 4px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:.9rem;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--purple)}
.btn.main{background:var(--purple);border-color:var(--purple);color:var(--surface);font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.row2{grid-template-columns:1fr}}

.media{border:1.5px dashed var(--line);border-radius:12px;padding:14px}
.media-empty{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.media-prev{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.media-prev img,.media-prev video{max-width:180px;max-height:220px;border-radius:10px;background:var(--bg)}
.media-actions{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.media .note{font-size:.8rem;color:var(--muted);margin-top:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.done-bar{margin-top:28px;text-align:center}
.done-btn{width:100%;border:none;border-radius:14px;padding:18px;background:var(--pink);color:var(--surface);font-family:var(--display);font-size:1.6rem;font-weight:600}
.done-btn.is-done{background:transparent;color:var(--pink);border:2px solid var(--pink)}
.done-bar .undo{margin-top:8px;font-size:.85rem;color:var(--muted);background:none;border:none;text-decoration:underline}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.tabs{display:flex;gap:8px;margin:22px 0 4px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 18px;font-weight:600;font-size:.92rem}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pick-intro h2{font-family:var(--display);font-size:2.2rem;font-weight:600;margin:22px 0 8px;line-height:1.05}
.pick-intro p{color:var(--muted);max-width:56ch;margin:0}
.statsum{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;background:var(--purple-soft);border:1px solid var(--purple);border-radius:16px;padding:18px;margin-top:22px}
.statsum .n{font-family:var(--display);font-size:2.3rem;font-weight:600;line-height:1}
.statsum .l{font-size:.82rem;color:var(--muted);margin-top:4px;line-height:1.3}
.wkhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.wkhead h3{margin:0;font-family:var(--display);font-size:1.7rem;font-weight:600;line-height:1.05}
.statgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.statgrid>div{min-width:0}
.statgrid label.f{min-height:2.7em;line-height:1.3}
.statgrid input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:1rem}
.statgrid .delta{font-size:.78rem;color:var(--muted);margin-top:5px;min-height:1.2em}
@media (max-width:640px){.statsum,.statgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chk{display:flex;align-items:center;gap:10px;margin-top:4px}
.chk input{width:20px;height:20px}
.chk label{font-size:.92rem}
.glance{background:var(--purple-soft);border:1px solid var(--purple);border-radius:16px;padding:18px;margin-top:22px}
.glance h3{font-family:var(--display);font-size:1.7rem;font-weight:600;margin:0 0 4px;line-height:1.05}
.glance h4{font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:18px 0 8px}
.grow{display:flex;align-items:baseline;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.grow .nm{flex:1;font-weight:600}
.grow .chg{font-size:.82rem;color:var(--muted);text-align:right}
.grow .big{font-family:var(--display);font-size:1.8rem;font-weight:600;line-height:1;min-width:3ch;text-align:right}
.brow{display:grid;grid-template-columns:110px minmax(0,1fr) 44px;gap:10px;align-items:center;padding:5px 0}
.track{background:var(--surface);border-radius:999px;height:12px;overflow:hidden}
.bar{height:12px;background:var(--purple);border-radius:999px;min-width:2px}
.brow .bn{font-family:var(--display);font-size:1.5rem;font-weight:600;text-align:right;line-height:1}
.rtotals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.rtotals .n{font-family:var(--display);font-size:2.2rem;font-weight:600;line-height:1}
.rtotals .l{font-size:.82rem;color:var(--muted);margin-top:4px;line-height:1.3}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.sgrid>div{min-width:0}
.sgrid input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:1rem}
.sh{margin:0;font-family:var(--display);font-size:1.7rem;font-weight:600;line-height:1.05}
.delta{font-size:.78rem;color:var(--muted);margin-top:5px;min-height:1.2em}
@media (max-width:520px){.rtotals{grid-template-columns:1fr}.brow{grid-template-columns:88px minmax(0,1fr) 40px}}
.celebrate{position:fixed;top:0;left:0;right:0;bottom:0;z-index:60;background:rgba(20,16,30,.78);display:flex;overflow-y:auto;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.cel-box{background:var(--surface);border-radius:20px;padding:22px;max-width:440px;width:100%;margin:auto;text-align:center}
.cel-box h2{font-family:var(--display);font-size:1.8rem;font-weight:600;margin:0;line-height:1.05}
.cel-box img{width:100%;height:auto;border-radius:14px;margin:16px 0;display:block}
.cel-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#confetti{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:70}
.wrows{display:flex;flex-direction:column;gap:10px;margin:8px 0 12px}
.wrow{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:start;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.wday{font-family:var(--display);font-size:1.35rem;font-weight:600;line-height:1.1}
.wtitle{font-weight:600}
.wmain .badge{margin:6px 6px 0 0}
.selrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:8px 0 14px}
.selrow label{font-weight:600;font-size:.9rem}
select{font:inherit;color:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.vcard{border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0;background:var(--surface)}
.vcard h4{margin-top:12px}
.quote{margin:12px 0 0;padding-left:12px;border-left:3px solid var(--pink);font-style:italic}
details{margin-top:14px}
summary{cursor:pointer;font-weight:600;color:var(--purple)}
@media (max-width:520px){.wrow{grid-template-columns:1fr;gap:4px}}
a.btn{display:inline-block;text-decoration:none;text-align:center;color:var(--ink)}
[hidden]{display:none!important}
a.btn.main{color:#fff}
.mrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.mrow input[type=text]{flex:1 1 200px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:1rem}
#stats-customize summary{font-family:var(--display);font-size:1.5rem;font-weight:600;color:var(--ink)}
.btn.rec{background:var(--pink-soft);border-color:var(--pink);color:var(--pink-text);font-weight:600}
.btn.rec::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:#E0245E;margin-right:8px;animation:recpulse 1.2s ease-in-out infinite}
@keyframes recpulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.btn.rec::before{animation:none}}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:14px}
.calhead{font-size:.74rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding:4px 0}
.cday{display:flex;flex-direction:column;gap:5px;min-height:116px;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;font:inherit;color:inherit;overflow:hidden;min-width:0}
button.cday{cursor:pointer}
button.cday:hover{border-color:var(--pink)}
.cday.off{background:transparent;border-style:dashed;opacity:.5}
.cday.blank{border:none;background:transparent;min-height:0}
.cday.today{border:2px solid var(--pink)}
.cday.done{background:linear-gradient(135deg,var(--purple-soft),var(--pink-soft))}
.cnum{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.cnum small{font-weight:500;color:var(--muted);font-size:.7rem}
.cchips{display:flex;flex-direction:column;gap:3px}
.cchip{display:flex;align-items:center;gap:4px;font-size:.74rem;line-height:1.2;min-width:0}
.cchip .ct{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crep{font-size:.72rem;color:var(--muted)}
.ctopic{font-size:.7rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.callegend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:16px}
.callegend .cchip{font-size:.82rem}
@media (max-width:700px){
  .cal{gap:4px}
  .cday{min-height:76px;padding:5px;gap:3px}
  .cchip .ct,.ctopic,.cnum small{display:none}
  .cchips{flex-direction:row;flex-wrap:wrap;gap:2px}
  .cchip{font-size:.95rem}
  .callegend .cchip .ct{display:inline}
}
.modebar{margin-top:0}
.cday.live{cursor:pointer}
.cday.live:hover{border-color:var(--pink)}
.cdaybtn{display:flex;justify-content:space-between;align-items:baseline;width:100%;background:none;border:none;padding:0;font:inherit;font-weight:700;color:inherit;cursor:pointer;text-align:left}
.cdaybtn small{font-weight:500;color:var(--muted);font-size:.7rem}
button.cchip{background:none;border:none;padding:1px 0;font:inherit;font-size:.74rem;color:inherit;cursor:pointer;text-align:left}
button.cchip:hover .ct{text-decoration:underline}
.libbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;margin:14px 0 4px}
.libpost{margin-top:12px}
.libpost .pbody{margin-top:14px}
@media (max-width:700px){.cdaybtn small{display:none}button.cchip{font-size:.95rem;padding:3px}}
.cc{margin-top:6px}
.ccrow{display:flex;flex-wrap:wrap;gap:6px}
.ccpill{font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--purple-soft);color:var(--purple)}
.ccpill.warn{background:rgba(224,160,0,.2);color:var(--ink)}
.ccpill.over{background:var(--pink-soft);color:var(--pink-text);box-shadow:0 0 0 1px var(--pink)}
.cchint{font-size:.78rem;color:var(--muted);margin-top:5px}
.pubrow{margin-top:12px}
.idea{border-top:1px solid var(--line);padding:10px 0}
.idea:first-of-type{border-top:none}
.publine{margin-top:12px}
.cchip.posted .ck{color:var(--pink-text);font-weight:700;margin-left:2px}
.cchip.posted .ct{color:var(--pink-text)}
.ltitle{margin:16px 0 0;font-family:var(--display);font-size:1.9rem;font-weight:600;line-height:1.05}
.count{margin-top:18px;font-size:.85rem;font-weight:600;color:var(--pink)}
h2.sect{font-family:var(--display);font-size:1.7rem;font-weight:600;margin:32px 0 0;line-height:1.05}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:14px;transition:border-color .2s,box-shadow .2s}
.pcard.sel{border-color:var(--pink);box-shadow:0 0 0 2px var(--pink)}
.phead{display:flex;gap:14px;align-items:flex-start}
.picon{font-size:1.8rem;line-height:1;width:52px;height:52px;border-radius:14px;background:var(--pink-soft);display:grid;place-items:center;flex:none}
.phead h3{margin:0;font-family:var(--display);font-size:1.7rem;font-weight:600;line-height:1.05}
.vibe{color:var(--muted);font-size:.95rem;margin-top:2px}
.badge{display:inline-block;font-size:.72rem;font-weight:600;border-radius:999px;padding:3px 10px;margin:8px 6px 0 0;background:var(--purple-soft);color:var(--purple)}
.badge.gold{background:var(--pink-soft);color:var(--ink)}
.pbest{margin:12px 0 0}
.pact{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn.on{background:var(--pink);border-color:var(--pink);color:var(--surface);font-weight:600}
.pbody{border-top:1px solid var(--line);margin-top:16px;padding-top:6px}
.pbody h4{font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:16px 0 6px}
.pbody ul,.summary ul{margin:0;padding-left:20px}
.pbody li,.summary li{margin-bottom:6px}
.ctabox{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--bg);border-radius:10px;padding:10px 12px}
.summary{background:var(--purple-soft);border:1px solid var(--purple);border-radius:16px;padding:18px;margin-top:28px}
.summary h3{font-family:var(--display);font-size:1.7rem;font-weight:600;margin:0 0 10px;line-height:1.05}
.summary .btn{margin-top:6px}

/* left navigation layout */
.app{display:grid;grid-template-columns:292px minmax(0,1fr);min-height:100vh}
.mainpane{min-width:0}
.wrap{max-width:820px;margin:0 auto;padding:32px 28px 90px}
.side{position:sticky;top:0;align-self:start;height:100vh;height:100dvh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:26px 18px 32px}
.brand h1{font-size:2.1rem;line-height:1}
.brand .sync{margin-top:10px}
.snav{display:flex;flex-direction:column;gap:4px;margin-top:22px}
.navitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;background:none;border-radius:12px;padding:12px;font-weight:600;font-size:.95rem}
.navitem .gl{color:var(--pink);font-size:.9rem}
.navitem:hover{background:var(--bg)}
.navitem[aria-current=page]{background:var(--purple-soft);color:var(--purple)}
.side .progress{flex-direction:column;gap:8px;margin:18px 0 0}
.side .pill{flex:none;padding:10px 12px;gap:10px;border-radius:12px}
.side .pill .n{font-size:1.6rem}
.side .pill .l{font-size:.8rem}
.sidehd{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:24px 0 0 4px;font-weight:600}
.side .days{display:block;margin:0}
.weeklabel{display:flex;justify-content:space-between;align-items:baseline;font-size:.82rem;font-weight:600;margin:14px 4px 6px}
.weeklabel span+span{font-weight:400;color:var(--muted);font-size:.76rem}
.weekgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.side .dot.today{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--purple)}
.side .legend{margin:14px 4px 0}
.topbar{display:none}
.scrim{display:none}
@media (max-width:860px){
  .app{display:block}
  .wrap{padding:22px 18px 90px}

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
const START = "2026-10-01", DAYS = 30, LS_KEY = "visibility-unleashed-v2";
const CHANNELS = {
  ig:{label:"Instagram & Facebook", fields:[]},
  tiktok:{label:"TikTok", fields:[{k:"hook",label:"Hook (the words on screen in the first 3 seconds)",rows:2},{k:"caption",label:"Caption",rows:5}]},
  threads:{label:"Threads", fields:[{k:"caption",label:"Post (500 characters or fewer)",rows:4}]},
  linkedin:{label:"LinkedIn", fields:[{k:"caption",label:"Post",rows:8}]},
  pinterest:{label:"Pinterest", fields:[{k:"title",label:"Pin title",rows:1},{k:"caption",label:"Pin description",rows:4}]},
  substack:{label:"Substack", fields:[{k:"title",label:"Post title (weekly post only)",rows:1},{k:"caption",label:"Note or post",rows:8}]},
  video:{label:"YouTube", fields:[{k:"title",label:"Video title",rows:1},{k:"caption",label:"Description",rows:6}]},
  email:{label:"Email", fields:[{k:"title",label:"Subject line",rows:1},{k:"caption",label:"Email",rows:9}]},
  stories:{label:"Stories", fields:[{k:"caption",label:"Story text",rows:4}]}
};

function normMetrics(old){
  const base=[["conv","Conversations started"],["joined","Joined my community"],["bought","Purchased my offer"]];
  const list=Array.isArray(old)?old.filter(m=>m&&typeof m.id==="string"&&typeof m.label==="string"):[];
  const out=base.map(b=>{ const f=list.find(m=>m.id===b[0]); return {id:b[0],label:(f&&f.label.trim())?f.label.trim().slice(0,40):b[1],on:f?f.on!==false:true,builtin:true,kind:"count"}; });
  list.filter(m=>!base.some(b=>b[0]===m.id)).slice(0,8).forEach(m=>out.push({id:m.id.slice(0,30),label:m.label.trim().slice(0,40)||"My stat",on:m.on!==false,builtin:false,kind:m.kind==="total"?"total":"count"}));
  return out;
}
let state = loadLocal() || {days:{}, updatedAt:0};
if(!state.weeks) state.weeks={};
if(!Array.isArray(state.picks)) state.picks=[];
if(!Array.isArray(state.extras)) state.extras=[];
if(!state.stats||typeof state.stats!=="object") state.stats={};
state.metrics=normMetrics(state.metrics);
if(state.mode!=="library") state.mode="day";
if(!state.library||typeof state.library!=="object"||Array.isArray(state.library)) state.library={};
if(typeof state.libUpdatedAt!=="number") state.libUpdatedAt=0;
if(!Array.isArray(state.offers)||state.offers.length!==2) state.offers=[{name:"",link:"",bio:false},{name:"",link:"",bio:false}];
if(!state.design||typeof state.design!=="object") state.design={type:"",authority:"",profile:"",open:[],channels:[],motors:[],gates:[],done:false};
["open","channels","motors","gates"].forEach(k=>{ if(!Array.isArray(state.design[k])) state.design[k]=[]; });
if(!state.plan||typeof state.plan!=="object") state.plan={emailDay:1,ytDay:3};
if(!state.brief||typeof state.brief!=="object") state.brief={week:0,newProject:false,client:"",help:"",notes:"",voice:"",topic:"",focus:{}};
["client","help","notes","voice","topic"].forEach(k=>{ if(typeof state.brief[k]!=="string") state.brief[k]=""; });
if(typeof state.brief.week!=="number") state.brief.week=0;
state.brief.newProject=!!state.brief.newProject;
if(!state.brief.focus||typeof state.brief.focus!=="object") state.brief.focus={};
if(typeof state.plan.emailDay!=="number") state.plan.emailDay=1;
if(typeof state.plan.ytDay!=="number") state.plan.ytDay=3;
function weekOf(n){ return Math.ceil(n/7); }
function weekRange(w){ const a=(w-1)*7+1, b=Math.min(w*7,DAYS); return `Days ${a} to ${b}`; }
let current = todayIndex() || 1;
let db=null, uid=null, dbWritable=false, downloads=null;
const dirty = new Set(); let saveTimer=null;

function loadLocal(){ try{ const r=localStorage.getItem(LS_KEY); return r?JSON.parse(r):null; }catch(e){ return null; } }
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function getDay(n){ if(!state.days[n]){ state.days[n]={active:defaultActive(n),channels:{},done:false,updatedAt:0}; setFormat(n,state.days[n]); } const d=state.days[n]; d.active=(d.active||[]).filter(k=>CHANNELS[k]); return d; }
function getCh(d,k){ if(!d.channels[k]) d.channels[k]={title:"",caption:"",cta:"",link:"",fileName:""}; const c=d.channels[k]; if(k==="ig"){ if(!c.format) c.format="reel"; if(!Array.isArray(c.slides)) c.slides=["",""]; if(c.hook==null) c.hook=""; } return c; }
const IG_FORMATS = {
  reel:{label:"Reel", media:"Video", accept:"video/*", multiple:false},
  post:{label:"Single post", media:"Image", accept:"image/*", multiple:false},
  carousel:{label:"Carousel", media:"Images, in slide order", accept:"image/*,video/*", multiple:true}
};
function dateFor(n){ const d=new Date(START+"T00:00:00"); d.setDate(d.getDate()+n-1); return d; }
function todayIndex(){ const s=new Date(START+"T00:00:00"), t=new Date(); t.setHours(0,0,0,0); const n=Math.round((t-s)/86400000)+1; return (n>=1&&n<=DAYS)?n:null; }
function longDate(n){ return dateFor(n).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"}); }
function hasTopic(n){ const d=state.days[n]; return !!(d&&d.topic&&String(d.topic).trim()); }
function planned(n){ const d=state.days[n]; if(!d) return false; return (d.active||[]).some(k=>{ const c=d.channels[k]; return c&&(c.caption||c.title||c.hook||c.cta||c.link||c.fileName||(c.slides||[]).some(x=>x)); }); }
function touch(k){
  if(k==="meta"){ state.updatedAt=Date.now(); } else if(k==="lib"){ state.libUpdatedAt=Date.now(); } else getDay(k).updatedAt=Date.now();
  dirty.add(k); saveLocal(); clearTimeout(saveTimer); saveTimer=setTimeout(flush,900);
}

/* helpers */
const $=id=>document.getElementById(id);
function el(tag,attrs,kids){
  const e=document.createElement(tag);
  if(attrs) for(const [k,v] of Object.entries(attrs)){
    if(k==="class") e.className=v; else if(k==="text") e.textContent=v;
    else if(k.startsWith("on")) e.addEventListener(k.slice(2),v);
    else if(v!==false&&v!=null) e.setAttribute(k,v===true?"":v);
  }
  (kids||[]).forEach(c=>c&&e.appendChild(typeof c==="string"?document.createTextNode(c):c));
  return e;
}
let toastT; function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),1700); }
function copyText(text){
  if(!text.trim()){ toast("Nothing to copy yet"); return; }
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(()=>toast("Copied"),()=>fallback(text));
  else fallback(text);
}
function fallback(text){ const ta=el("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");toast("Copied");}catch(e){toast("Select the text and copy it by hand");} ta.remove(); }
function fullPost(ch){ return [ch.caption, [ch.cta, ch.link].filter(x=>x&&x.trim()).join(" ")].filter(x=>x&&x.trim()).join("\n\n"); }

/* files stored on this device (IndexedDB) */
let idbP=null;
function idb(){ if(idbP) return idbP; idbP=new Promise((res,rej)=>{ try{ const r=indexedDB.open("vu-media",1); r.onupgradeneeded=()=>r.result.createObjectStore("files"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);}catch(e){rej(e);} }); return idbP; }
async function fileGet(key){ try{ const d=await idb(); return await new Promise(r=>{ const q=d.transaction("files").objectStore("files").get(key); q.onsuccess=()=>r(q.result||null); q.onerror=()=>r(null); }); }catch(e){ return null; } }
async function filePut(key,val){ const d=await idb(); return new Promise((res,rej)=>{ const tx=d.transaction("files","readwrite"); tx.objectStore("files").put(val,key); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); }
async function fileDel(key){ try{ const d=await idb(); await new Promise(res=>{ const tx=d.transaction("files","readwrite"); tx.objectStore("files").delete(key); tx.oncomplete=res; tx.onerror=res; }); }catch(e){} }

/* render */
function renderDots(){
  const box=$("days"); box.innerHTML=""; const t=todayIndex();
  const weeks=Math.ceil(DAYS/7);
  for(let w=1;w<=weeks;w++){
    box.appendChild(el("div",{class:"weeklabel"},[el("span",{text:`Week ${w}`}),el("span",{text:weekRange(w)})]));
    const grid=el("div",{class:"weekgrid"});
    const a=(w-1)*7+1, b=Math.min(w*7,DAYS);
    for(let n=a;n<=b;n++){
      const d=state.days[n]; const cls=d&&d.done?"done":(planned(n)||hasTopic(n))?"planned":"";
      const isSel=(n===current&&view==="plan");
      grid.appendChild(el("button",{type:"button",class:`dot ${cls} ${n===t?"today":""} ${isSel?"sel":""}`,
        "aria-label":`Day ${n}${cls==="done"?", done":cls==="planned"?", planned":""}`,"aria-current":isSel?"true":false,
        text:String(n),onclick:()=>goDay(n)}));
    }
    box.appendChild(grid);
  }
  $("topLabel").textContent = ({design:"My design",pick:"Choose my platforms",guide:"My weekly plan",cal:"My calendar",write:"Write my week",offers:"Promote your offers",stats:"My stats"})[view] || ("Day "+current);
}
function renderProgress(){
  let done=0; for(let n=1;n<=DAYS;n++) if(state.days[n]&&state.days[n].done) done++;
  $("doneN").textContent=`${done}/${DAYS}`;
  const t=todayIndex();
  if(view==="plan") $("subline").textContent = t ? `Today is Day ${t}. Plan ahead, then come back here to copy, paste and post.`
    : `Starts ${longDate(1)}. Plan your posts ahead, then come back here each day to copy, paste and post.`;
}

function textField(id,label,value,rows,onInput,placeholder){
  const inp = rows>1 ? el("textarea",{id,rows,placeholder:placeholder||""}) : el("input",{id,type:"text",placeholder:placeholder||""});
  inp.value=value||""; inp.addEventListener("input",()=>onInput(inp.value));
  return el("div",{class:"field"},[
    el("div",{class:"field-top"},[el("label",{class:"f",for:id,text:label}), el("button",{type:"button",class:"copy",text:"Copy",onclick:()=>copyText(inp.value)})]),
    inp
  ]);
}

async function getFiles(key){ const r=await fileGet(key); if(!r) return []; return Array.isArray(r)?r:[r]; }
function mediaBox(n,k,ch,opt){
  opt=opt||{label:"Image or video",accept:"image/*,video/*",multiple:false};
  const key=`${n}-${k}`, box=el("div",{class:"media"}), inputId=`file-${key}`, nameId=`fname-${key}`;
  const nameInp=el("input",{id:nameId,type:"text",placeholder:opt.multiple?"e.g. Canva pages 4 to 8":"e.g. day1-reel.mp4 or Canva page 3"});
  nameInp.value=ch.fileName||"";
  nameInp.addEventListener("input",()=>{ ch.fileName=nameInp.value; touch(n); renderDots(); });
  const fileInp=el("input",{type:"file",id:inputId,accept:opt.accept,multiple:opt.multiple,class:"sr"});
  fileInp.addEventListener("change", async ()=>{
    const picked=[...(fileInp.files||[])]; fileInp.value=""; if(!picked.length) return;
    const recs=picked.map(f=>({blob:f,name:f.name,type:f.type}));
    const list = opt.multiple ? (await getFiles(key)).concat(recs) : recs.slice(0,1);
    try{
      await filePut(key,list);
      if(!nameInp.value){ nameInp.value=list.map(r=>r.name).join(", "); ch.fileName=nameInp.value; }
      touch(n); renderDots(); draw(); toast("Attached");
    }catch(e){ toast("That file is too big for this device. Write its name below instead."); }
  });
  const area=el("div");
  async function draw(){
    area.innerHTML=""; const list=await getFiles(key);
    if(!list.length){
      area.appendChild(el("div",{class:"media-empty"},[
        el("label",{class:"btn",for:inputId,text:opt.multiple?"Attach images":"Attach "+opt.label.toLowerCase()}),
        el("span",{class:"hint",text:"Or just write the file name below."})
      ])); return;
    }
    list.forEach((rec,i)=>{
      const url=URL.createObjectURL(rec.blob);
      const prev=(rec.type||"").startsWith("video")?el("video",{src:url,controls:true,playsinline:true}):el("img",{src:url,alt:rec.name});
      area.appendChild(el("div",{class:"media-prev",style:"margin-bottom:12px"},[prev, el("div",{class:"media-actions"},[
        el("span",{class:"hint",text:(opt.multiple?`Slide ${i+1}: `:"")+rec.name}),
        downloads?el("button",{type:"button",class:"btn main",text:"Save to my phone or computer",onclick:async()=>{
          try{ await downloads.save({filename:rec.name,data:rec.blob}); }catch(e){ if(e&&e.code!=="declined") toast("Couldn't save here. Press and hold the preview to save it."); }
        }}):el("span",{class:"hint",text:"Press and hold the preview to save it."}),
        el("button",{type:"button",class:"copy",text:"Remove",onclick:async()=>{ const l=await getFiles(key); l.splice(i,1); if(l.length) await filePut(key,l); else await fileDel(key); draw(); }})
      ])]));
    });
    area.appendChild(el("label",{class:"btn",for:inputId,text:opt.multiple?"Add more images":"Replace"}));
  }
  draw();
  box.append(el("div",{class:"f",text:opt.label}), fileInp, area,
    el("div",{class:"field",style:"margin:12px 0 0"},[el("label",{class:"f",for:nameId,text:opt.multiple?"File names":"File name"}), nameInp]),
    el("div",{class:"note",text:"Attached files stay on the device you attached them from."}));
  return box;
}

function slidesBlock(n,ch){
  const wrap=el("div",{class:"field"});
  function draw(){
    wrap.innerHTML="";
    wrap.appendChild(el("div",{class:"f",text:"Slides"},[el("span",{class:"hint",text:"  The words on each slide. Slide 1 is the hook."})]));
    ch.slides.forEach((txt,i)=>{
      const id=`d${n}-slide-${i}`;
      const ta=el("textarea",{id,rows:2,placeholder:i===0?"The hook that stops the scroll":"What this slide says"}); ta.value=txt;
      ta.addEventListener("input",()=>{ ch.slides[i]=ta.value; touch(n); renderDots(); });
      wrap.appendChild(el("div",{style:"margin-bottom:10px"},[
        el("div",{class:"field-top"},[el("label",{class:"f",for:id,text:`Slide ${i+1}`}), el("span",{},[
          el("button",{type:"button",class:"copy",text:"Copy",onclick:()=>copyText(ta.value)}),
          ch.slides.length>1?el("button",{type:"button",class:"copy",text:"Remove",onclick:()=>{ ch.slides.splice(i,1); touch(n); draw(); }}):null
        ])]), ta]));
    });
    if(ch.slides.length<20) wrap.appendChild(el("button",{type:"button",class:"btn",text:"Add a slide",onclick:()=>{ ch.slides.push(""); touch(n); draw(); }}));
  }
  draw(); return wrap;
}

function renderChannel(n,d,k){
  const def=CHANNELS[k], ch=getCh(d,k);
  const sec=el("section",{class:"ch","aria-label":def.label});
  sec.appendChild(el("div",{class:"ch-head"},[
    el("h3",{text:def.label}),
    el("button",{type:"button",class:"btn main",text:"Copy post",onclick:()=>copyText((ch.title&&k!=="ig"?ch.title+"\n\n":"")+fullPost(ch))})
  ]));
  const sug=suggestionFor(n,k);
  if(sug) sec.appendChild(el("p",{class:"hint",text:"Suggested today: "+sug.label+". "+sug.note+(repurposeNames().length?" Then share the same post on "+joinNames(repurposeNames())+".":""),style:"margin:-4px 0 12px"}));
  let mediaOpt=null;
  if(k==="ig"){
    const fmts=el("div",{class:"chips",role:"group","aria-label":"Type of Instagram post",style:"margin-bottom:16px"});
    Object.entries(IG_FORMATS).forEach(([fk,fd])=>fmts.appendChild(el("button",{type:"button",class:"chip","aria-pressed":String(ch.format===fk),text:fd.label,onclick:()=>{ ch.format=fk; touch(n); renderEditor(); }})));
    sec.appendChild(el("div",{},[el("div",{class:"f",text:"What kind of post is it?"}),fmts]));
    const fd=IG_FORMATS[ch.format];
    if(ch.format==="reel") sec.appendChild(textField(`d${n}-ig-hook`,"Hook (the words on screen in the first 3 seconds)",ch.hook,2,v=>{ch.hook=v;touch(n);renderDots();},"The line that stops the scroll"));

async function flush(){

  try{
    for(const k of keys){
      const body = k==="lib" ? {library:state.library||{}, updatedAt:state.libUpdatedAt||0} : k==="meta" ? {mode:state.mode||"day", stats:state.stats||{}, metrics:state.metrics||[], offers:state.offers||[], design:state.design||{}, plan:state.plan||{}, brief:state.brief||{}, weeks:state.weeks||{}, picks:state.picks||[], extras:state.extras||[], hd:state.hd||"", updatedAt:state.updatedAt||0} : state.days[k];
      await db.doc(`data/users/${uid}/${k==="meta"?"meta":k==="lib"?"library":"day-"+k}`).set(JSON.parse(JSON.stringify(body)));
    }
    setSync("Your plan saves to your account, so it's there on any device.");

    keys.forEach(k=>dirty.add(k));

  }
}

      for(let w=WEEKS;w>=1;w--){ const v=getStat(w,"fol",p.id); if(v!=null){ latest=v; break; } }
      const shown = latest!=null ? latest : start;
      let chg="";
      if(latest!=null&&start!=null){ const d=latest-start; chg=(d>0?"+":"")+d+" since you started"; }
      else if(latest==null&&start!=null) chg="Starting point";
      box.appendChild(el("div",{class:"grow"},[
        el("span",{class:"nm",text:p.name}),
        el("span",{class:"chg",text:chg}),
        el("span",{class:"big",text:shown==null?"-":String(shown)})
      ]));
    });
    box.appendChild(el("h4",{text:"Skool traffic by platform"}));
    const totals=pls.map(p=>{ let t=0; for(let w=1;w<=WEEKS;w++){ const v=getStat(w,"traf",p.id); if(v!=null) t+=v; } return {name:p.name,t:t}; });
    const max=Math.max.apply(null,totals.map(x=>x.t).concat([1]));
    totals.forEach(x=>box.appendChild(el("div",{class:"brow"},[
      el("span",{text:x.name}),
      el("div",{class:"track"},[el("div",{class:"bar",style:"width:"+Math.round(x.t/max*100)+"%"})]),
      el("span",{class:"bn",text:String(x.t)})
    ])));
  } else {
    box.appendChild(el("p",{class:"hint",text:"Choose your platforms and their followers and Skool traffic will show up here.",style:"margin:6px 0 0"}));
  }
  const tile = m => {
    if(m.kind==="total"){
      let latest=null; for(let w=WEEKS;w>=1;w--){ const v=getStat(w,"res",m.id); if(v!=null){ latest=v; break; } }
      const start=getStat(0,"res",m.id);
      const shown=latest!=null?latest:start;
      let sub=m.label;
      if(latest!=null&&start!=null){ const d=latest-start; sub=m.label+" ("+(d>0?"+":"")+d+" since you started)"; }
      return el("div",{},[el("div",{class:"n",text:shown==null?"-":String(shown)}), el("div",{class:"l",text:sub})]);
    }
    let t=0; for(let w=1;w<=WEEKS;w++){ const v=getStat(w,"res",m.id); if(v!=null) t+=v; }
    return el("div",{},[el("div",{class:"n",text:String(t)}), el("div",{class:"l",text:m.label})]);
  };
  const baseOn=metricsOn().filter(m=>m.builtin), extraOn=metricsOn().filter(m=>!m.builtin);
  if(baseOn.length){ box.appendChild(el("h4",{text:"Results"})); box.appendChild(el("div",{class:"rtotals"},baseOn.map(tile))); }
  if(extraOn.length){ box.appendChild(el("h4",{text:"My own stats"})); box.appendChild(el("div",{class:"rtotals"},extraOn.map(tile))); }
  return box;
};
const refreshStats = () => {
  Object.keys(statRefs.deltas).forEach(key=>{ const d=statRefs.deltas[key]; d.node.textContent=deltaText(d.w,d.g,d.k); });
  if(statRefs.glance){ const fresh=glanceNode(); statRefs.glance.replaceWith(fresh); statRefs.glance=fresh; }
};
const fieldNode = (w,g,k,label) => {
  const id="st-"+w+"-"+g+"-"+k;
  const inp=el("input",{id:id,type:"number",inputmode:"numeric",min:"0",placeholder:"0"});
  inp.value=rawStat(w,g,k);
  inp.addEventListener("input",()=>{ setStat(w,g,k,inp.value); touch("meta"); refreshStats(); });
  const dl=el("div",{class:"delta",text:deltaText(w,g,k)});
  statRefs.deltas[id]={node:dl,w:w,g:g,k:k};
  return el("div",{},[el("label",{class:"f",for:id,text:label}), inp, dl]);
};
const secNode = (title,hint,fields) => el("section",{class:"pcard","aria-label":title},[

let statsCustomizeOpen = false, removeArm = null;
const customizeCard = () => {
  const det=el("details",{class:"pcard",id:"stats-customize"});
  if(statsCustomizeOpen) det.open=true;
  det.addEventListener("toggle",()=>{ statsCustomizeOpen=det.open; });
  det.appendChild(el("summary",{text:"Customize my stats"}));
  det.appendChild(el("p",{class:"hint",text:"Track what matters to you. Rename a stat, hide one you don't need, or add your own, like views or email subscribers. Pick 'Running total' for numbers like followers, and 'Adds up each week' for numbers like views.",style:"margin:10px 0 12px"}));
  const kindSelect = (value,onChange,id) => {
    const s=el("select",{"aria-label":"How it counts"}); if(id) s.id=id;
    [["count","Adds up each week"],["total","Running total"]].forEach(o=>{ const op=el("option",{value:o[0],text:o[1]}); if(o[0]===value) op.selected=true; s.appendChild(op); });
    s.addEventListener("change",()=>onChange(s.value));
    return s;
  };
  state.metrics.forEach(m=>{
    const nameInp=el("input",{type:"text","aria-label":"Stat name",maxlength:"40"}); nameInp.value=m.label;
    nameInp.addEventListener("change",()=>{ m.label=nameInp.value.trim().slice(0,40)||m.label; touch("meta"); renderStats(); });
    nameInp.addEventListener("keydown",e=>{ if(e.key==="Enter") nameInp.blur(); });
    const sid="mshow-"+m.id;
    const show=el("input",{type:"checkbox",id:sid}); show.checked=m.on;
    show.addEventListener("change",()=>{ m.on=show.checked; touch("meta"); renderStats(); });
    const kids=[nameInp, el("div",{class:"chk",style:"margin:0"},[show, el("label",{for:sid,text:"Show"})])];
    if(!m.builtin){
      kids.push(kindSelect(m.kind,v=>{ m.kind=v; touch("meta"); renderStats(); }));
      const rm=el("button",{type:"button",class:"btn",text:removeArm===m.id?"Tap again to remove":"Remove",onclick:()=>{
        if(removeArm!==m.id){ removeArm=m.id; renderStats(); setTimeout(()=>{ if(removeArm===m.id){ removeArm=null; if(view==="stats") renderStats(); } },3500); return; }
        removeArm=null;
        state.metrics=state.metrics.filter(x=>x.id!==m.id);
        Object.keys(state.stats).forEach(w=>{ if(state.stats[w]&&typeof state.stats[w]==="object") delete state.stats[w][m.id]; });
        touch("meta"); toast("Stat removed."); renderStats();
      }});
      kids.push(rm);
    }
    det.appendChild(el("div",{class:"mrow"},kids));
  });
  det.appendChild(el("div",{class:"f",text:"Add a stat",style:"margin:16px 0 6px"}));
  const newName=el("input",{type:"text",id:"metric-new","aria-label":"New stat name",maxlength:"40",placeholder:"e.g. Views, Email subscribers, Sales"});
  const newKind=kindSelect("count",()=>{},"metric-new-kind");
  const add=()=>{
    const name=newName.value.trim().slice(0,40);
    if(!name){ toast("Give your stat a name first."); return; }
    if(state.metrics.filter(m=>!m.builtin).length>=8){ toast("Eight of your own stats is the limit. Remove one first."); return; }
    state.metrics.push({id:"c"+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36),label:name,on:true,builtin:false,kind:newKind.value});
    statsCustomizeOpen=true; touch("meta"); toast("Stat added."); renderStats();
  };
  newName.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); add(); } });
  det.appendChild(el("div",{class:"mrow",style:"border-top:none"},[newName,newKind,el("button",{type:"button",class:"btn main",text:"Add stat",onclick:add})]));
  return det;
};
const renderStats = () => {
  const box=$("view-stats"); box.innerHTML=""; statRefs.deltas={};
  const t=todayIndex(), thisWeek=t?weekOf(t):null;
  if(statsWeek==null) statsWeek = thisWeek!=null ? thisWeek : 0;
  const w=statsWeek, pls=statPlatforms();
  box.appendChild(el("div",{class:"pick-intro"},[

    el("p",{text:"Once a week is plenty. At the end of the week, come here and add your numbers. Leave any box empty if you don't want to track it."})

  }
  box.appendChild(chips);
  box.appendChild(el("h2",{class:"sect",text:w===0?"Where you're starting":"Week "+w}));
  box.appendChild(el("p",{class:"hint",text:w===0?"Enter your follower count before you begin, so you can see your growth.":weekRange(w)+(w===thisWeek?".  This is your week to fill in.":"."),style:"margin:6px 2px 0"}));
  if(!pls.length){
    box.appendChild(el("section",{class:"pcard"},[
      el("p",{text:"Choose your platforms first. Then you can track followers and Skool traffic for each one.",style:"margin:0 0 12px"}),
      el("button",{type:"button",class:"btn main",text:"Choose my platforms",onclick:()=>setView("pick")})
    ]));
  } else {
    box.appendChild(secNode("Followers", w===0?"":"Your follower count at the end of the week.",
      pls.map(p=>fieldNode(w,"fol",p.id,(p.id==="youtube"||p.id==="substack")?p.name+" subscribers":p.name+" followers"))));
    if(w>=1) box.appendChild(secNode("Skool traffic from your socials","How many people came to your community from each platform this week. Check your link clicks, or ask new members how they found you.",
      pls.map(p=>fieldNode(w,"traf",p.id,"From "+p.name))));
  }
  if(w>=1){ const baseOn=metricsOn().filter(m=>m.builtin); if(baseOn.length) box.appendChild(secNode("Results","",baseOn.map(m=>fieldNode(w,"res",m.id,m.label)))); }
  const extraOn=metricsOn().filter(m=>!m.builtin && (w>=1 || m.kind==="total"));
  if(extraOn.length) box.appendChild(secNode("My own stats", w===0?"Your starting number for the stats that run as a total.":"", extraOn.map(m=>fieldNode(w,"res",m.id,m.label))));
  box.appendChild(customizeCard());
};

const CARD_FRAME_ON_BG = false;
const CARD_TEXT = "dark"; /* use "dark" for a light background image */
const CARD_SCRIM = 0.4; /* 0 to 1, a soft wash behind the text so it stays readable */
const CARD_LAYOUT = "portal"; /* "portal" moves the text to clear the artwork */
let cardBgImg = null;
if(CARD_BG){ cardBgImg=new Image(); cardBgImg.src=CARD_BG; }
const drawCard = n => {
  const W=1080, H=1350, c=document.createElement("canvas"); c.width=W; c.height=H;
  const g=c.getContext("2d");
  const hasBg = !!(cardBgImg && cardBgImg.complete && cardBgImg.naturalWidth>0);
  if(hasBg){
    const s=Math.max(W/cardBgImg.naturalWidth,H/cardBgImg.naturalHeight), dw=cardBgImg.naturalWidth*s, dh=cardBgImg.naturalHeight*s;
    g.drawImage(cardBgImg,(W-dw)/2,(H-dh)/2,dw,dh);
  } else {
    const grad=g.createLinearGradient(0,0,W,H); grad.addColorStop(0,"#2A0F4F"); grad.addColorStop(.55,"#6A2496"); grad.addColorStop(1,"#D63384");
    g.fillStyle=grad; g.fillRect(0,0,W,H);
    const glow=g.createRadialGradient(W*.2,H*.12,20,W*.2,H*.12,W*.75); glow.addColorStop(0,"rgba(190,140,255,.35)"); glow.addColorStop(1,"rgba(190,140,255,0)");
    g.fillStyle=glow; g.fillRect(0,0,W,H);
  }
  if(!hasBg || CARD_FRAME_ON_BG){
    g.strokeStyle="rgba(255,255,255,.6)"; g.lineWidth=3; g.strokeRect(48,48,W-96,H-96);
    g.strokeStyle="rgba(255,255,255,.25)"; g.lineWidth=1.5; g.strokeRect(66,66,W-132,H-132);
  }
  const LY = (hasBg && CARD_LAYOUT==="portal")
    ? {cx:540,title:352,sub:398,base:660,ofo:95,head:785,plat:841,dots:1096,dgap:44,dx:76,dcx:540,count:1266,date:1306,ccx:540}
    : (hasBg && CARD_LAYOUT==="boho")
    ? {cx:700,title:96,sub:140,base:410,ofo:74,head:520,plat:572,dots:752,dgap:50,dx:50,dcx:775,count:972,date:1010,ccx:775}
    : {cx:540,title:170,sub:222,base:640,ofo:95,head:790,plat:850,dots:960,dgap:58,dx:76,dcx:540,count:1196,date:1238,ccx:540};
  if(hasBg && CARD_SCRIM>0){
    const sc=g.createRadialGradient(LY.cx,LY.base-120,40,LY.cx,LY.base-120,640);
    const rgb = CARD_TEXT==="dark" ? "255,255,255" : "30,8,60";
    sc.addColorStop(0,"rgba("+rgb+","+CARD_SCRIM+")"); sc.addColorStop(1,"rgba("+rgb+",0)");
    g.fillStyle=sc; g.fillRect(0,0,W,H);
  }
  const dk = hasBg && CARD_TEXT==="dark";
  const C = dk
    ? {brand:"#5A1F8E",sub:"#4A1A7C",day:"#8A2A93",numA:"#2A0F4F",numB:"#6A2496",of:"#4A1A7C",head:"#2A0F4F",plat:"#4A1A7C",dotOn:"#2A0F4F",dotOff:"rgba(42,15,79,.5)",ring:"#2A0F4F",count:"#2A0F4F",date:"#4A1A7C"}
    : {brand:"#FFD3EC",sub:"#E8D6FB",day:"#FFC2E6",numA:"#FFFFFF",numB:"#FFC2E6",of:"#E8D6FB",head:"#FFFFFF",plat:"#FFE3F3",dotOn:"#FFE3F3",dotOff:"rgba(255,255,255,.55)",ring:"#FFFFFF",count:"#FFFFFF",date:"#FFE3F3"};
  const shade=()=>{ if(hasBg){ g.shadowColor=dk?"rgba(255,255,255,.45)":"rgba(0,0,0,.35)"; g.shadowBlur=14; g.shadowOffsetY=dk?0:2; } };
  const unshade=()=>{ g.shadowColor="transparent"; g.shadowBlur=0; g.shadowOffsetY=0; };
  const txt=(s,x,y,font,color,align)=>{ g.font=font; g.fillStyle=color; g.textAlign=align||"center"; g.textBaseline="alphabetic"; shade(); g.fillText(s,x,y); unshade(); };
  try{ g.letterSpacing="6px"; }catch(e){}
  txt("\u2726  VISIBILITY UNLEASHED  \u2726",LY.cx,LY.title,"600 32px "+SANS,C.brand);
  try{ g.letterSpacing="0px"; }catch(e){}
  txt("30 day challenge",LY.cx,LY.sub,"400 30px "+SANS,C.sub);
  /* Day and the number side by side */
  const dayFont="600 130px "+SERIF, numFont="600 340px "+SERIF, baseY=LY.base, gapX=36;
  g.font=dayFont; const wDay=g.measureText("Day").width;
  g.font=numFont; const wNum=g.measureText(String(n)).width;
  const startX=LY.cx-(wDay+gapX+wNum)/2;
  txt("Day",startX,baseY,dayFont,C.day,"left");
  const numG=g.createLinearGradient(0,baseY-250,0,baseY); numG.addColorStop(0,C.numA); numG.addColorStop(1,C.numB);
  txt(String(n),startX+wDay+gapX,baseY,numFont,numG,"left");
  const all = doneCount()>=DAYS;
  txt(all?"I showed up for all 30 days.":"I showed up today.",LY.cx,LY.head,"600 68px "+SERIF,C.head);
  const d=getDay(n);
  const pl=libUsedLabels(n);
  const labels = pl.length ? pl : (state.mode==="library" ? [] : (d.active||[]).map(k=>CHANNELS[k]&&CHANNELS[k].label).filter(Boolean));
  if(labels.length){
    let line="Posted on "+labels.join(", ");
    let size=34; g.font="500 "+size+"px "+SANS;
    while(g.measureText(line).width>(LY.cx===540?W-220:560)&&size>20){ size-=2; g.font="500 "+size+"px "+SANS; }
    txt(line,LY.cx,LY.plat,"500 "+size+"px "+SANS,C.plat);
  }
  const cols=10, gap=LY.dx, startDots=LY.dcx-(cols-1)*gap/2;
  for(let i=1;i<=DAYS;i++){
    const col=(i-1)%cols, row=Math.floor((i-1)/cols);
    const x=startDots+col*gap, y=LY.dots+row*LY.dgap;
    const isDone=state.days[i]&&state.days[i].done;
    g.beginPath(); g.arc(x,y,19,0,Math.PI*2);
    if(isDone){ g.fillStyle=C.dotOn; g.fill(); }
    else { g.strokeStyle=C.dotOff; g.lineWidth=2; g.stroke(); }
    if(i===n){ g.beginPath(); g.arc(x,y,27,0,Math.PI*2); g.strokeStyle=C.ring; g.lineWidth=4; g.stroke(); }
  }
  txt(doneCount()+" of "+DAYS+" days done",LY.ccx,LY.count,"600 34px "+SANS,C.count);
  txt(longDate(n),LY.ccx,LY.date,"400 28px "+SANS,C.date);
  return c;
};
const confetti = () => {
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const old=$("confetti"); if(old) old.remove();
  const cv=el("canvas",{id:"confetti","aria-hidden":"true"}); document.body.appendChild(cv);
  const dpr=window.devicePixelRatio||1, W=window.innerWidth, H=window.innerHeight;
  cv.width=W*dpr; cv.height=H*dpr;
  const g=cv.getContext("2d"); g.scale(dpr,dpr);
  const colors=["#FF6BB3","#D63384","#B892FF","#7A3BE0","#FFFFFF","#FFD3EC"];
  const parts=[];
  for(let i=0;i<170;i++) parts.push({x:W/2+(Math.random()-.5)*W*.35,y:H*.4,vx:(Math.random()-.5)*18,vy:-Math.random()*15-3,w:6+Math.random()*8,h:4+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:colors[i%colors.length]});
  const start=performance.now(), LIFE=4200;
  const tick=now=>{
    const t=now-start; g.clearRect(0,0,W,H);
    parts.forEach(p=>{ p.vy+=.34; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
      g.save(); g.globalAlpha=Math.max(0,1-t/LIFE); g.translate(p.x,p.y); g.rotate(p.r); g.fillStyle=p.c; g.fillRect(-p.w/2,-p.h/2,p.w,p.h); g.restore(); });
    if(t<LIFE && document.body.contains(cv)) requestAnimationFrame(tick); else cv.remove();
  };
  requestAnimationFrame(tick);
};
const saveCard = (canvas,n) => {
  canvas.toBlob(async blob=>{
    const name="visibility-unleashed-day-"+n+".png";
    if(!blob){ toast("Press and hold the image to save it."); return; }
    if(downloads){
      try{ await downloads.save({filename:name,data:blob}); }
      catch(e){ if(e&&e.code!=="declined") toast("Press and hold the image to save it."); }
      return;
    }
    try{ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); }
    catch(e){ toast("Press and hold the image to save it."); }
  },"image/png");
};
const celebrate = (n,again) => {
  const canvas=drawCard(n);
  let overlay=null;
  const onKey=e=>{ if(e.key==="Escape") close(); };
  const close=()=>{
    if(overlay) overlay.remove();
    const cf=$("confetti"); if(cf) cf.remove();
    document.body.style.overflow="";
    document.removeEventListener("keydown",onKey);
    if(!again && n<DAYS) current=n+1;
    renderAll(); window.scrollTo({top:0,behavior:"smooth"});
  };
  const img=el("img",{src:canvas.toDataURL("image/png"),alt:"Your Day "+n+" card"});
  const keep=el("button",{type:"button",class:"btn",text:again?"Close":"Keep going",onclick:close});
  overlay=el("div",{class:"celebrate",role:"dialog","aria-modal":"true","aria-label":"Day "+n+" done"},[
    el("div",{class:"cel-box"},[
      el("h2",{text:doneCount()>=DAYS?"All 30 days done.":"Day "+n+" done. You showed up."}),
      el("p",{class:"hint",text:"Take a screenshot or save it, then share it to your Stories.",style:"margin:6px 0 0"}),
      img,
      el("div",{class:"cel-actions"},[
        el("button",{type:"button",class:"btn main",text:"Save image",onclick:()=>saveCard(canvas,n)}),
        keep
      ]),
      el("p",{class:"hint",text:"On a phone, you can also press and hold the image.",style:"margin:12px 0 0"})
    ])
  ]);
  document.body.appendChild(overlay);
  document.body.style.overflow="hidden";
  document.addEventListener("keydown",onKey);
  confetti();
  keep.focus();
};

const CENTERS = [

let voiceStop = null;
const voiceControls = ta => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const wrap = el("div",{class:"voice"});
  if(!SR){
    wrap.appendChild(el("p",{class:"hint",text:"Voice notes aren't available in this browser. On your phone, tap the microphone on your keyboard and talk instead.",style:"margin:8px 0 0"}));
    return wrap;
  }
  let rec=null, listening=false, timer=null;
  const btn=el("button",{type:"button",class:"btn",text:"\uD83C\uDFA4 Record a voice note"});
  const status=el("div",{class:"hint",role:"status","aria-live":"polite",style:"margin-top:8px;min-height:1.3em"});
  const append = text => {
    const t=(text||"").trim(); if(!t) return;
    ta.value = ta.value.trim() ? ta.value.replace(/\s+$/,"")+" "+t : t;
    ta.dispatchEvent(new Event("input",{bubbles:true}));
  };
  const setIdle = () => { listening=false; clearTimeout(timer); btn.textContent="\uD83C\uDFA4 Record a voice note"; btn.classList.remove("rec"); btn.setAttribute("aria-pressed","false"); voiceStop=null; };
  const stop = msg => {
    if(rec){ try{ rec.stop(); }catch(e){} }
    setIdle();
    if(typeof msg==="string") status.textContent=msg;
  };
  const start = () => {
    try{ rec=new SR(); }catch(e){ status.textContent="I couldn't start the microphone."; return; }
    rec.lang=navigator.language||"en-US"; rec.continuous=true; rec.interimResults=true;
    rec.onresult=ev=>{
      let interim="";
      for(let i=ev.resultIndex;i<ev.results.length;i++){
        const r=ev.results[i];
        if(r.isFinal) append(r[0].transcript); else interim+=r[0].transcript;
      }
      if(listening) status.textContent = interim ? "Hearing: "+interim : "Listening...";
    };
    rec.onerror=ev=>{
      const code=ev&&ev.error;
      const msg = (code==="not-allowed"||code==="service-not-allowed") ? "The microphone is blocked. Allow it in your browser settings, or tap the microphone on your keyboard and talk instead."
        : code==="no-speech" ? "I didn't hear anything. Try again."
        : code==="audio-capture" ? "I couldn't find a microphone."
        : "Something went wrong with the microphone.";
      stop(msg);
    };
    rec.onend=()=>{ if(listening){ setIdle(); status.textContent="Got it. Read it over and edit anything you like."; } };
    try{ rec.start(); }catch(e){ status.textContent="I couldn't start the microphone."; return; }
    listening=true; btn.textContent="Stop recording"; btn.classList.add("rec"); btn.setAttribute("aria-pressed","true");
    status.textContent="Listening...";
    voiceStop=()=>stop();
    timer=setTimeout(()=>stop("Stopped after two minutes. Read it over and edit anything you like."),120000);
  };
  btn.addEventListener("click",()=>{ if(listening) stop("Got it. Read it over and edit anything you like."); else start(); });
  wrap.appendChild(el("div",{class:"pact",style:"margin-top:8px"},[btn]));
  wrap.appendChild(status);
  wrap.appendChild(el("p",{class:"hint",text:"Talk for about a minute, like you're telling a friend what you do. Your browser turns your voice into text. The planner doesn't keep the recording.",style:"margin:4px 0 0"}));
  return wrap;
};

  const card=el("section",{class:"pcard pubrow","aria-label":title},[
    el("div",{class:"wtitle",text:chIcon(k)+" "+title}),
    el("div",{class:"hint",text:hint})
  ]);
  if(multi && keys.some(x=>!d.pub[x].done)){
    card.appendChild(el("div",{class:"pact"},[el("button",{type:"button",class:"btn main",text:"Mark both as posted",onclick:()=>{ keys.forEach(x=>{ d.pub[x].done=true; }); touch(n); rerender(); }})]));
  }
  keys.forEach(x=>card.appendChild(pubLine(n,d,x,multi,rerender)));
  if(showLib) card.appendChild(el("div",{class:"pact"},[el("button",{type:"button",class:"btn",text:"Open my "+libName(k)+" library",onclick:()=>{ libUI.tab=k; libUI.page="library"; renderLibrary(); }})]));
  return card;
};
const pubSection = (n,d,rerender,showLib) => {
  if(!d.pub||typeof d.pub!=="object") d.pub={};
  const keys=libChannels(), plannedKeys=dayKeys(n).filter(k=>keys.indexOf(k)>-1), picked=pickedChannels();
  const hasPub=k=>pubKeysFor(k).some(x=>d.pub[x]&&d.pub[x].done);
  const shown=keys.filter(k=>plannedKeys.indexOf(k)>-1||hasPub(k)||picked.indexOf(k)>-1);
  const wrap=el("div",{class:"block"});
  wrap.appendChild(el("div",{class:"f",text:"Where I posted"}));
  wrap.appendChild(el("p",{class:"hint",style:"margin:4px 0 0",text:"Posted something? Mark it here. You can do this for any day, any time."}));
  shown.forEach(k=>wrap.appendChild(pubCard(n,d,k,plannedKeys.indexOf(k)>-1,rerender,showLib)));
  const rest=keys.filter(k=>shown.indexOf(k)===-1);
  if(rest.length){
    wrap.appendChild(el("div",{class:"f",text:"Posted somewhere else?",style:"margin-top:14px"}));
    wrap.appendChild(el("div",{class:"chips",role:"group","aria-label":"Other platforms",style:"margin-top:6px"},rest.map(k=>el("button",{type:"button",class:"chip","aria-pressed":"false",text:chIcon(k)+" "+libName(k),onclick:()=>{
      pubKeysFor(k).forEach(x=>{ d.pub[x]={done:true,url:(d.pub[x]&&d.pub[x].url)||""}; }); touch(n); rerender();
    }}))));
  }
  return wrap;
};
const renderLibraryDay = () => {
  $("subline").hidden=false;
  const box=$("editor"); box.innerHTML="";
  const n=current, d=getDay(n);
  if(!d.pub||typeof d.pub!=="object") d.pub={};
  box.appendChild(modeToggleNode(()=>renderAll()));
  box.appendChild(el("div",{class:"dayhead"},[
    el("div",{},[el("h2",{text:"Day "+n}),el("div",{class:"date",text:longDate(n)})]),
    el("div",{class:"nav"},[
      el("button",{type:"button","aria-label":"Previous day",text:"\u2039",disabled:n<=1,onclick:()=>{ current--; renderAll(); }}),
      el("button",{type:"button","aria-label":"Next day",text:"\u203A",disabled:n>=DAYS,onclick:()=>{ current++; renderAll(); }})
    ])
  ]));
  box.appendChild(el("div",{class:"pact",style:"margin-bottom:6px"},[el("button",{type:"button",class:"btn",text:"Back to my library",onclick:()=>{ libUI.page="library"; renderLibrary(); }})]));
  if(!pickedChannels().length){
    box.appendChild(el("section",{class:"pcard"},[
      el("p",{text:"Choose your platform first, and your days fill in with where you're posting.",style:"margin:0 0 12px"}),
      el("button",{type:"button",class:"btn main",text:"Choose my platforms",onclick:()=>setView("pick")})
    ]));
    return;
  }
  box.appendChild(pubSection(n,d,renderLibrary,true));
  const bar=el("div",{class:"done-bar"});
  if(d.done){
    bar.appendChild(el("div",{class:"done-btn is-done",text:"Day "+n+" is done"}));
    bar.appendChild(el("button",{type:"button",class:"btn",style:"margin-top:12px",text:"See my Day "+n+" card",onclick:()=>celebrate(n,true)}));
    bar.appendChild(el("button",{type:"button",class:"undo",text:"Mark as not done",onclick:()=>{ d.done=false; touch(n); renderAll(); }}));
  } else {
    bar.appendChild(el("button",{type:"button",class:"done-btn",text:"Done with Day "+n,onclick:()=>{ d.done=true; touch(n); celebrate(n); }}));
  }
  box.appendChild(bar);
};
const renderLibrary = () => {
  if(libUI.page==="day"){ renderLibraryDay(); return; }
  $("subline").hidden=true;
  const box=$("editor"); box.innerHTML="";
  box.appendChild(modeToggleNode(()=>renderAll()));
  if(!pickedChannels().length){
    box.appendChild(el("section",{class:"pcard"},[
      el("p",{text:"Choose your platform first, and your library gets a tab for each one.",style:"margin:0 0 12px"}),
      el("button",{type:"button",class:"btn main",text:"Choose my platforms",onclick:()=>setView("pick")})
    ]));
    return;
  }
  const keys=libChannels();
  if(!libUI.tab || keys.indexOf(libUI.tab)===-1) libUI.tab=pickedChannels()[0];
  box.appendChild(el("div",{class:"pick-intro"},[
    el("h2",{text:"My library"}),
    el("p",{text:"Write posts whenever you feel inspired. Pick one when you're ready to post, then mark it used. To update a day, tap it on the left or in your calendar."})
  ]));
  box.appendChild(el("div",{class:"block",style:"margin-top:18px"},[
    el("div",{class:"chips",role:"group","aria-label":"Platforms"},keys.map(k=>el("button",{type:"button",class:"chip","aria-pressed":String(libUI.tab===k),text:chIcon(k)+" "+libName(k)+" ("+libCount(k,"ready")+")",onclick:()=>{ libUI.tab=k; renderLibrary(); }})))
  ]));
  const k=libUI.tab;
  box.appendChild(el("div",{class:"libbar"},[
    el("div",{class:"chips",role:"group","aria-label":"Filter"},[
      el("button",{type:"button",class:"chip","aria-pressed":String(libUI.filter==="ready"),text:"Ready ("+libCount(k,"ready")+")",onclick:()=>{ libUI.filter="ready"; renderLibrary(); }}),
      el("button",{type:"button",class:"chip","aria-pressed":String(libUI.filter==="used"),text:"Used ("+libCount(k,"used")+")",onclick:()=>{ libUI.filter="used"; renderLibrary(); }})
    ]),
    el("button",{type:"button",class:"btn main",text:"Add a post to "+libName(k),onclick:()=>libAdd(k)})
  ]));
  { let ch=false; libList(k).forEach(p=>{ if(!isUsed(p) && libAutoLink(p)) ch=true; }); if(ch) touch("lib"); }
  const list=libList(k).filter(p=>libUI.filter==="used"?isUsed(p):!isUsed(p));
  if(!list.length){
    box.appendChild(el("p",{class:"hint",style:"margin:14px 2px",text:libUI.filter==="ready"?"Nothing here yet. Add a post whenever you feel inspired, or write a bunch on a day you have the energy and they'll be ready to go.":"Nothing used from this tab yet."}));
  } else list.forEach(p=>box.appendChild(libCard(k,p)));
};
const openCards = new Set();
let view = "pick";

const orderIdx = k => Object.keys(CHANNELS).indexOf(k);
const platformById = id => PLATFORMS.find(p=>p.id===id);
const pickedChannels = () => {
  const out=[];
  (state.picks||[]).forEach(id=>{ const p=platformById(id); if(p&&p.ch&&!out.includes(p.ch)) out.push(p.ch); });
  return out;
};
const makeMain = id => {
  const i=state.picks.indexOf(id); if(i<1) return;
  state.picks.splice(i,1); state.picks.unshift(id);
  touch("meta"); renderPick();
};
const togglePick = id => {
  const i=state.picks.indexOf(id);
  if(i>-1){ state.picks.splice(i,1); }
  else {
    if(state.picks.length>=3){ toast("Three is the limit. Tap one to let it go first."); return; }
    state.picks.push(id);
  }
  touch("meta"); renderPick();
};

const toggleExtra = id => {
  const i=state.extras.indexOf(id);
  if(i>-1) state.extras.splice(i,1); else state.extras.push(id);
  touch("meta"); renderPick();
};

const cardNode = p => {
  const sel = state.picks.indexOf(p.id)>-1 || (p.kind==="extra" && state.extras.indexOf(p.id)>-1);
  const isOpen = openCards.has(p.id);
  const badges = el("div",{},[
    p.kind==="built" ? el("span",{class:"badge",text:"Built in"}) : null,
    p.kind==="bonus" ? el("span",{class:"badge",text:"Optional bonus"}) : null,
    p.kind==="extra" ? el("span",{class:"badge",text:"Optional"}) : null,
    (p.kind==="pick" && state.picks.indexOf(p.id)>-1) ? el("span",{class:"badge gold",text:state.picks[0]===p.id?"Your main platform":"Repurpose here"}) : null
  ]);
  const actions = el("div",{class:"pact"},[
    el("button",{type:"button",class:"btn","aria-expanded":String(isOpen),text:isOpen?"Hide the lesson":"Read the lesson",onclick:()=>{
      if(openCards.has(p.id)) openCards.delete(p.id); else openCards.add(p.id);
      renderPick();
    }}),
    p.kind==="pick" ? el("button",{type:"button",class:"btn "+(state.picks.indexOf(p.id)>-1?"on":"main"),"aria-pressed":String(state.picks.indexOf(p.id)>-1),text:state.picks.indexOf(p.id)>-1?"Chosen":"Choose this one",onclick:()=>togglePick(p.id)}) : null,
    (p.kind==="pick" && state.picks.indexOf(p.id)>0) ? el("button",{type:"button",class:"btn",text:"Make this my main",onclick:()=>makeMain(p.id)}) : null,
    p.kind==="extra" ? el("button",{type:"button",class:"btn "+(state.extras.indexOf(p.id)>-1?"on":"main"),"aria-pressed":String(state.extras.indexOf(p.id)>-1),text:state.extras.indexOf(p.id)>-1?"Added to my month":"Add to my month",onclick:()=>toggleExtra(p.id)}) : null
  ]);
  const card = el("section",{class:"pcard"+(sel?" sel":""),"aria-label":p.name},[
    el("div",{class:"phead"},[
      el("div",{class:"picon","aria-hidden":"true",text:p.icon}),
      el("div",{},[el("h3",{text:p.name}), el("div",{class:"vibe",text:p.vibe}), badges])
    ]),
    el("p",{class:"pbest"},[el("strong",{text:"Best if: "}), p.best]),
    actions
  ]);
  if(isOpen){
    const body = el("div",{class:"pbody"});
    body.appendChild(el("h4",{text:"How to use it"}));
    body.appendChild(el("ul",{},p.how.map(t=>el("li",{text:t}))));
    body.appendChild(el("h4",{text:"Rhythm"}));
    body.appendChild(el("p",{text:p.rhythm,style:"margin:0"}));
    body.appendChild(el("h4",{text:"A call to action you can borrow"}));
    body.appendChild(el("div",{class:"ctabox"},[el("span",{text:p.cta}), el("button",{type:"button",class:"copy",text:"Copy",onclick:()=>copyText(p.cta)})]));
    body.appendChild(el("h4",{text:"Watch out for"}));
    body.appendChild(el("p",{text:p.watch,style:"margin:0"}));
    card.appendChild(body);
  }
  return card;
};

const summaryNode = () => {
  const chs=pickedChannels();
  const box=el("section",{class:"summary","aria-label":"Your month"});
  box.appendChild(el("h3",{text:"Your month"}));
  if(!chs.length){
    box.appendChild(el("p",{text:"Choose your platform above. Your month shows up here.",style:"margin:0"}));
    return box;
  }
  const lines=["Post every day on: "+chName(chs[0])];
  const rn=repurposeNames();
  if(rn.length) lines.push("Repurpose the same post on: "+joinNames(rn));
  if(usesStories()) lines.push("Stories: one to two a day");
  if(state.extras.indexOf("youtube")>-1) lines.push("YouTube: one video a week, on "+WEEKDAYS[state.plan.ytDay]+"s");
  lines.push("Email: once a week, on "+WEEKDAYS[state.plan.emailDay]+"s");
  box.appendChild(el("ul",{},lines.map(t=>el("li",{text:t}))));
  box.appendChild(el("p",{class:"hint",text:rn.length?"Stay with "+chName(chs[0])+". Share the same post on the others instead of writing new ones. You can move any of this around in your weekly plan.":"You can move any of this around in your weekly plan."}));
  box.appendChild(el("div",{class:"pact"},[
    el("button",{type:"button",class:"btn main",text:"See my weekly plan",onclick:()=>setView("guide")}),
    el("button",{type:"button",class:"btn",text:"Build my 30 days",onclick:()=>{ applyDefaults(); saveLocal(); libUI.page="library"; setView("plan"); toast("Your 30 days are set up. Everything is editable."); }})
  ]));
  return box;
};

const renderPick = () => {
  const box=$("view-pick"); box.innerHTML="";
  const n=(state.picks||[]).length;
  box.appendChild(el("div",{class:"pick-intro"},[
    el("h2",{text:"Pick your platform"}),
    el("p",{text:"Pick the platform you'll post on every day this month. You can choose up to 3, but stay with one. The first one you pick is your main platform, and the others are places to repurpose the same posts. It's best to just stick with one. Stories come with Instagram, Facebook and TikTok. A weekly email is part of everyone's month. YouTube is an optional extra."})
  ]));
  box.appendChild(el("div",{class:"count",role:"status",text:n+" of 3 chosen"}));
  PLATFORMS.filter(p=>p.kind==="pick").forEach(p=>box.appendChild(cardNode(p)));
  box.appendChild(el("h2",{class:"sect",text:"Part of your month"}));
  PLATFORMS.filter(p=>p.kind==="built").forEach(p=>box.appendChild(cardNode(p)));
  box.appendChild(el("h2",{class:"sect",text:"Optional extras"}));
  PLATFORMS.filter(p=>p.kind==="extra"||p.kind==="bonus").forEach(p=>box.appendChild(cardNode(p)));
  box.appendChild(summaryNode());
};

const closeDrawer = () => { document.body.classList.remove("nav-open"); $("menuBtn").setAttribute("aria-expanded","false"); };
const VIEWS = ["design","pick","guide","cal","write","offers","plan","stats"];
const setView = v => {
  if(voiceStop) voiceStop();
  view=v;
  VIEWS.forEach(x=>{
    $("view-"+x).hidden = x!==v;
    $("tab"+x.charAt(0).toUpperCase()+x.slice(1)).setAttribute("aria-current", x===v ? "page" : "false");
  });
  renderDots(); renderProgress();
  $("subline").hidden = v!=="plan";
  if(v==="design") renderDesign(); else if(v==="pick") renderPick(); else if(v==="guide") renderGuide(); else if(v==="cal") renderCalendar(); else if(v==="write") renderWrite(); else if(v==="stats") renderStats(); else if(v==="offers") renderOffers(); else renderEditor();
  closeDrawer();
  window.scrollTo({top:0,behavior:"smooth"});
};
const goDay = n => { current=n; libUI.page="day"; setView("plan"); };
$("menuBtn").addEventListener("click",()=>{ const o=document.body.classList.toggle("nav-open"); $("menuBtn").setAttribute("aria-expanded",String(o)); });
$("scrim").addEventListener("click",closeDrawer);
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeDrawer(); });
$("tabPick").addEventListener("click",()=>setView("pick"));
$("tabDesign").addEventListener("click",()=>setView("design"));
$("tabGuide").addEventListener("click",()=>setView("guide"));
$("tabCal").addEventListener("click",()=>setView("cal"));
$("tabWrite").addEventListener("click",()=>setView("write"));
$("tabStats").addEventListener("click",()=>setView("stats"));
$("tabOffers").addEventListener("click",()=>setView("offers"));
$("tabPlan").addEventListener("click",()=>{ libUI.page="library"; setView("plan"); });

setView(!state.design.done ? "design" : ((state.picks||[]).length ? "plan" : "pick")); initSync();
})();
</script>
</body>
</html>
